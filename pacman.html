<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0BDY2YR4GP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-0BDY2YR4GP');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PAC-MAN '80</title>
    <author>Liran Barniv</author>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
      * { margin:0; padding:0; box-sizing:border-box; }
      body {
        background:#000;
        display:flex; flex-direction:column;
        align-items:center; justify-content:center;
        min-height:100vh; min-height:100svh;
        font-family:'Press Start 2P', monospace;
        overflow:hidden;
        touch-action:none;
      }
      #wrapper { position:relative; display:inline-block; flex-shrink:0; }
      canvas { display:block; image-rendering:pixelated; }
      #crt {
        position:absolute; top:0; left:0; width:100%; height:100%;
        pointer-events:none; z-index:10;
        background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.13) 2px,rgba(0,0,0,0.13) 4px);
      }

      /* ── MOBILE CONTROLS ── */
      #mobile-controls {
        display:none;
        flex-direction:row;
        align-items:center;
        gap:16px;
        margin-top:16px;
        margin-bottom: 50px;
        flex-shrink:0;
      }

      /* D-pad */
      #dpad {
        display:grid;
        grid-template-areas: 'upleft up upright' 'left center right';
        grid-template-columns: repeat(3, minmax(64px, 140px));
        grid-template-rows: minmax(64px, 64px) minmax(64px, auto);
        gap:6px;
      }
      #dpad button {
        background:rgba(255,255,255,0.08);
        border:2px solid rgba(255,224,0,0.55);
        border-radius:12px;
        color:#FFE000; font-size:22px;
        cursor:pointer; touch-action:manipulation;
        -webkit-user-select:none; user-select:none;
        display:flex; align-items:center; justify-content:center;
        margin-left: auto; margin-right: auto;
      }
      button.vertical { width: 90%; height: 160%; margin-top:10% }
      button.horizontal { width: 90%; height: 90%; }
      #dpad button:active { background:rgba(255,224,0,0.28); }
      .dpad-up    { grid-area:up; }
      #dpad button.dpad-left  { grid-area:upleft; }
      .dpad-center{ grid-area:none; border:2px solid rgba(255,255,255,0.08); border-radius:50%;
                    background:rgba(255,255,255,0.03); pointer-events:none; margin-left: 18px;margin-right: 18px; }
      #dpad button.dpad-right { grid-area:upright; }
      #dpad button.dpad-down  { grid-area:center; }

      /* Action buttons — shared base */
      #action-btns {
        display:flex;
        gap:10px;
        margin-top: -360px;
        z-index: 50;
        background-color: #000;
      }

      #action-btns button {
        background:rgba(255,255,255,0.08);
        border:2px solid rgba(255,224,0,0.55);
        border-radius:12px;
        color:#FFE000;
        cursor:pointer; touch-action:manipulation;
        -webkit-user-select:none; user-select:none;
        display:flex; align-items:center; justify-content:center;
      }
      #action-btns button:active { background:rgba(255,224,0,0.28); }
      .btn-icon  { line-height:1; }
      .btn-label { letter-spacing:0.05em; }

      /* ── GAME MODE: dpad + stacked action buttons ── */
      #mobile-controls.game-mode #action-btns {
        flex-direction:column;
        height:204px; /* 3×64 + 2×6 = matches dpad */
      }
      #mobile-controls.game-mode #action-btns button {
        flex:1; width:78px;
        flex-direction:column; gap:5px;
      }
      #mobile-controls.game-mode .btn-icon  { font-size:22px; }
      #mobile-controls.game-mode .btn-label { font-size:7px; }

      /* ── MENU MODE: no dpad, wide horizontal play button ── */
      #mobile-controls.menu-mode #dpad { display:none; }
      #mobile-controls.menu-mode #action-btns {
        flex-direction:row;
        justify-content:center;
      }
      #mobile-controls.menu-mode #action-btns button {
        width:160px; height:64px;
        flex-direction:row; gap:12px;
      }
      #mobile-controls.menu-mode .btn-icon  { font-size:26px; }
      #mobile-controls.menu-mode .btn-label { font-size:13px; }
    </style>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
  </head>
<body>
<div id="wrapper">
  <canvas id="c" data-touchstart="puase"></canvas>
  <div id="crt"></div>
</div>
<div id="mobile-controls">
  <div id="dpad">
    <button type="button" class="dpad-up horizontal"    data-dir="1">▲</button>
    <button type="button" class="dpad-left vertical"  data-dir="2">◀</button>
    <button type="button" class="dpad-right vertical" data-dir="0">▶</button>
    <button type="button" class="dpad-down horizontal"  data-dir="3">▼</button>
  </div>
  <div id="action-btns">
    <button type="button" id="btn-primary">
      <span class="btn-icon">▶</span>
      <span class="btn-label">PLAY</span>
    </button>
    <button type="button" id="btn-secondary">
      <span class="btn-icon">❌</span>
      <span class="btn-label">NO</span>
    </button>
  </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
