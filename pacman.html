<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PAC-MAN '80</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#000;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    min-height:100vh;
    font-family:'Press Start 2P', monospace;
  }
  #wrapper { position:relative; display:inline-block; }
  canvas { display:block; image-rendering:pixelated; }
  #crt {
    position:absolute; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:10;
    background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.13) 2px,rgba(0,0,0,0.13) 4px);
  }
</style>
</head>
<body>
<div id="wrapper">
  <canvas id="c"></canvas>
  <div id="crt"></div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ── MAZE ────────────────────────────────────────────────
// 0=dot 1=wall 2=power 3=empty 4=ghost-house-door
const RAW = [
 "1111111111111111111111111111",
 "1000000000000110000000000001",
 "1011110111110110111110111101",
 "1211110111110110111110111121",
 "1011110111110110111110111101",
 "1000000000000000000000000001",
 "1011110110111111110110111101",
 "1011110110111111110110111101",
 "1000000110000110000110000001",
 "1111110111110110111110111111",
 "1111110111110110111110111111",
 "1111110110333333330110111111",
 "1111110110344444430110111111",
 "0000000003444444430000000000",
 "1111110110344444430110111111",
 "1111110110333333330110111111",
 "1111110110111111110110111111",
 "1111110110111111110110111111",
 "1000000000000110000000000001",
 "1011110111110110111110111101",
 "1011110111110110111110111101",
 "1200110000000000000000110021",
 "1110110110111111110110110111",
 "1110110110111111110110110111",
 "1000000110000110000110000001",
 "1011111111110110111111111101",
 "1011111111110110111111111101",
 "1000000000000000000000000001",
 "1111111111111111111111111111",
];

const ROWS = RAW.length;
const COLS = RAW[0].length;
const CS = 20; // cell size
const TOP = 40; // score bar height

canvas.width  = COLS * CS;
canvas.height = ROWS * CS + TOP + 20;

// Parse maze
let maze = RAW.map(r => r.split('').map(Number));

// Count total dots
let totalDots = 0;
maze.forEach(r => r.forEach(c => { if(c===0||c===2) totalDots++; }));

// ── AUDIO ────────────────────────────────────────────────
const AC = new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d,t='square',v=0.25){
  try{
    const o=AC.createOscillator(), g=AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.type=t; o.frequency.value=f;
    g.gain.setValueAtTime(v,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
    o.start(); o.stop(AC.currentTime+d);
  }catch(e){}
}
function playEat(){ beep(440+Math.random()*80,0.04,'square',0.15); }
function playDeath(){
  [523,415,330,262,208,165,131].forEach((f,i)=>setTimeout(()=>beep(f,0.12,'sawtooth'),i*120));
}
function playPowerUp(){ beep(660,0.08); setTimeout(()=>beep(880,0.12),80); }

// ── STATE ────────────────────────────────────────────────
const TILE = CS;
const HALF = TILE/2;

let score=0, lives=3, dotsEaten=0, level=1;
let state='TITLE'; // TITLE PLAYING DEAD LEVELUP GAMEOVER
let titleBlink=0, deadTimer=0, levelTimer=0;
let powerTimer=0;
let globalDot=0; // dot animation phase

// Pac-Man
let pac = { x:13.5, y:21, dir:0, nextDir:0, mouthAngle:0, mouthOpen:true, speed:0.1, alive:true };

// direction vectors [dx,dy]
const DIRS = [[1,0],[0,-1],[-1,0],[0,1],[0,0]];
// dir indices: 0=R 1=U 2=L 3=D 4=stop

// Ghosts
const GHOST_COLORS = ['#FF0000','#FFB8FF','#00FFFF','#FFB852'];
const GHOST_NAMES  = ['BLINKY','PINKY','INKY','CLYDE'];
const GHOST_HOME   = [[13,11],[13,13],[12,13],[14,13]];

function makeGhost(i){
  return {
    x: GHOST_HOME[i][0], y: GHOST_HOME[i][1],
    dir: 1, color: GHOST_COLORS[i], name: GHOST_NAMES[i],
    mode: i===0?'chase':'house', // blinky starts outside
    houseTimer: i*120,
    speed: 0.085,
    eaten: false,
    cellX: -1, cellY: -1,
  };
}
let ghosts = [0,1,2,3].map(makeGhost);

// ── HELPERS ──────────────────────────────────────────────
function cellAt(x,y){
  const cx=Math.round(x), cy=Math.round(y);
  if(cy<0||cy>=ROWS||cx<0||cx>=COLS) return 1;
  return maze[cy][cx];
}

function canMove(x,y,dx,dy){
  const nx=x+dx*0.5, ny=y+dy*0.5;
  const cx=Math.round(nx), cy=Math.round(ny);
  if(cy<0||cy>=ROWS) return false;
  // wrap tunnel
  if(cx<0||cx>=COLS) return true;
  const c=maze[cy][cx];
  return c!==1 && c!==4;
}

function canMoveGhost(x,y,dx,dy){
  // Check from exact grid position one full cell ahead
  const nx=x+dx, ny=y+dy;
  let cx=Math.round(nx), cy=Math.round(ny);
  if(cy<0||cy>=ROWS) return false;
  if(cx<0) cx=COLS-1;
  if(cx>=COLS) cx=0;
  const c=maze[cy][cx];
  return c!==1 && c!==4;
}

// ── UPDATE ───────────────────────────────────────────────
function resetPositions(){
  pac.x=13.5; pac.y=21; pac.dir=4; pac.nextDir=4; pac.alive=true;
  ghosts=[0,1,2,3].map(makeGhost);
  powerTimer=0;
}

function eatCell(){
  const cx=Math.round(pac.x), cy=Math.round(pac.y);
  const c=maze[cy][cx];
  if(c===0){ maze[cy][cx]=3; score+=10; dotsEaten++; playEat(); }
  else if(c===2){ maze[cy][cx]=3; score+=50; dotsEaten++; powerTimer=400; playPowerUp(); }
  if(dotsEaten>=totalDots){ state='LEVELUP'; levelTimer=120; }
}

function updatePac(){
  if(!pac.alive) return;

  // try next direction
  const [ndx,ndy]=DIRS[pac.nextDir];
  if(pac.nextDir!==4 && canMove(pac.x,pac.y,ndx,ndy)) pac.dir=pac.nextDir;

  const [dx,dy]=DIRS[pac.dir];
  if(pac.dir!==4 && canMove(pac.x,pac.y,dx,dy)){
    pac.x+=dx*pac.speed;
    pac.y+=dy*pac.speed;
    // tunnel wrap
    if(pac.x<0) pac.x=COLS-0.5;
    if(pac.x>=COLS) pac.x=0.5;
    // snap to grid
    if(dx!==0) pac.y=Math.round(pac.y);
    if(dy!==0) pac.x=Math.round(pac.x);
  }

  // mouth animation
  pac.mouthAngle = pac.mouthOpen ? pac.mouthAngle+0.2 : pac.mouthAngle-0.2;
  if(pac.mouthAngle>0.35){ pac.mouthOpen=false; }
  if(pac.mouthAngle<0.01){ pac.mouthOpen=true; }

  eatCell();
}

function updateGhosts(){
  const sp = level===1?1:1+level*0.05;
  ghosts.forEach((g,i)=>{
    if(g.eaten){
      // move towards home fast
      const tx=GHOST_HOME[0][0], ty=12;
      const dx=tx-g.x, dy=ty-g.y;
      if(Math.abs(dx)+Math.abs(dy)<0.3){ g.eaten=false; g.mode='house'; g.houseTimer=60; }
      g.x+=Math.sign(dx)*0.18; g.y+=Math.sign(dy)*0.18;
      return;
    }

    if(g.mode==='house'){
      g.houseTimer--;
      // bob up and down in house
      g.y += Math.sin(globalDot*0.1)*0.03;
      if(g.houseTimer<=0){ g.mode='exit'; }
      return;
    }

    if(g.mode==='exit'){
      // move toward exit (13, 11)
      const tx=13, ty=11;
      const dxe=tx-g.x, dye=ty-g.y;
      if(Math.abs(dxe)+Math.abs(dye)<0.3){ g.mode='chase'; g.dir=1; g.cellX=-1; g.cellY=-1; }
      g.x+=Math.sign(dxe)*g.speed*sp;
      g.y+=Math.sign(dye)*g.speed*sp;
      return;
    }

    // chase / frightened
    const frightened = powerTimer>0;
    const gsp = frightened ? g.speed*0.6*sp : g.speed*sp;

    // At a grid intersection — snap and choose new direction (only once per cell)
    const snapX = Math.round(g.x), snapY = Math.round(g.y);
    const atCenter = Math.abs(g.x - snapX) < gsp+0.06 &&
                     Math.abs(g.y - snapY) < gsp+0.06 &&
                     (snapX !== g.cellX || snapY !== g.cellY);

    if(atCenter){
      g.cellX = snapX; g.cellY = snapY;
      g.x = snapX;
      g.y = snapY;

      let tx=pac.x, ty=pac.y;
      if(frightened){
        tx = pac.x + (g.x-pac.x)*3;
        ty = pac.y + (g.y-pac.y)*3;
      } else if(i===1){ tx=pac.x+DIRS[pac.dir][0]*4; ty=pac.y+DIRS[pac.dir][1]*4; }
      else if(i===2){ tx=COLS/2; ty=ROWS/2; }

      const possible=[0,1,2,3].filter(d=>{
        const rev=(g.dir+2)%4;
        if(d===rev && !frightened) return false;
        const [ddx,ddy]=DIRS[d];
        return canMoveGhost(g.x,g.y,ddx,ddy);
      });

      if(possible.length>0){
        let best;
        if(frightened){
          best=possible[Math.floor(Math.random()*possible.length)];
        } else {
          let minDist=Infinity;
          possible.forEach(d=>{
            const [ddx,ddy]=DIRS[d];
            const dist=(g.x+ddx-tx)**2+(g.y+ddy-ty)**2;
            if(dist<minDist){ minDist=dist; best=d; }
          });
        }
        g.dir=best;
      }
    }

    // Only move if not blocked by a wall
    const [gdx,gdy]=DIRS[g.dir];
    const ahead = { x: Math.round(g.x+gdx*0.6), y: Math.round(g.y+gdy*0.6) };
    let bx=ahead.x; if(bx<0)bx=COLS-1; if(bx>=COLS)bx=0;
    const blocked = ahead.y>=0 && ahead.y<ROWS && maze[ahead.y][bx]===1;

    if(!blocked){
      g.x+=gdx*gsp; g.y+=gdy*gsp;
      if(g.x<0) g.x=COLS-1;
      if(g.x>=COLS) g.x=0;
    }
  });

  // collision with pac
  ghosts.forEach(g=>{
    if(g.eaten) return;
    const dist=Math.hypot(g.x-pac.x, g.y-pac.y);
    if(dist<0.75){
      if(powerTimer>0){
        g.eaten=true;
        score+=200;
        beep(880,0.05); beep(1100,0.08);
      } else {
        pac.alive=false;
        lives--;
        state='DEAD';
        deadTimer=180;
        playDeath();
      }
    }
  });
}

// ── INPUT ────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(state==='TITLE' && e.code==='Space'){ state='PLAYING'; resetPositions(); return; }
  if(state==='GAMEOVER' && e.code==='Space'){ restartGame(); return; }
  if(state!=='PLAYING') return;
  if(e.code==='ArrowRight'||e.code==='KeyD') pac.nextDir=0;
  if(e.code==='ArrowUp'   ||e.code==='KeyW') pac.nextDir=1;
  if(e.code==='ArrowLeft' ||e.code==='KeyA') pac.nextDir=2;
  if(e.code==='ArrowDown' ||e.code==='KeyS') pac.nextDir=3;
  e.preventDefault();
});

function restartGame(){
  score=0; lives=3; dotsEaten=0; level=1; powerTimer=0;
  maze=RAW.map(r=>r.split('').map(Number));
  totalDots=0;
  maze.forEach(r=>r.forEach(c=>{if(c===0||c===2)totalDots++;}));
  resetPositions();
  state='PLAYING';
}

// ── DRAW ─────────────────────────────────────────────────
function drawMaze(){
  maze.forEach((row,ry)=>{
    row.forEach((cell,cx)=>{
      const px=cx*CS, py=ry*CS+TOP;
      if(cell===1){
        ctx.fillStyle='#1a1aff';
        ctx.fillRect(px,py,CS,CS);
        // inner highlight
        ctx.fillStyle='#3333ff';
        ctx.fillRect(px+1,py+1,CS-2,CS-2);
        ctx.fillStyle='#1a1aff';
        ctx.fillRect(px+2,py+2,CS-4,CS-4);
      } else if(cell===0){
        // dot
        ctx.fillStyle='#ffb8ae';
        ctx.beginPath();
        ctx.arc(px+HALF,py+HALF,2,0,Math.PI*2);
        ctx.fill();
      } else if(cell===2){
        // power pellet - blinking
        if(Math.floor(globalDot/15)%2===0){
          ctx.fillStyle='#ffb8ae';
          ctx.shadowColor='#ffb8ae';
          ctx.shadowBlur=8;
          ctx.beginPath();
          ctx.arc(px+HALF,py+HALF,5,0,Math.PI*2);
          ctx.fill();
          ctx.shadowBlur=0;
        }
      }
    });
  });
}

function drawPac(){
  const px=pac.x*CS+HALF, py=pac.y*CS+HALF+TOP;
  const r=HALF-1;
  const ma=pac.mouthAngle;

  ctx.shadowColor='#ffff00';
  ctx.shadowBlur=10;
  ctx.fillStyle='#FFE000';

  // rotation based on dir
  const angles=[[0],[Math.PI*1.5],[Math.PI],[Math.PI*0.5]];
  const rot = pac.dir<4 ? angles[pac.dir][0] : 0;

  ctx.save();
  ctx.translate(px,py);
  ctx.rotate(rot);
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.arc(0,0,r,ma,Math.PI*2-ma);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  ctx.shadowBlur=0;
}

function drawGhost(g){
  const px=g.x*CS+HALF, py=g.y*CS+HALF+TOP;
  const r=HALF-1;
  const frightened=powerTimer>0;
  const flashing=powerTimer>0&&powerTimer<100&&Math.floor(globalDot/10)%2===0;

  let bodyColor = frightened ? (flashing?'#ffffff':'#2121de') : g.color;
  let eyeColor  = frightened ? '#ffb852' : '#ffffff';
  let pupilColor= frightened ? '#ffb852' : '#000099';

  ctx.shadowColor=bodyColor; ctx.shadowBlur=8;
  ctx.fillStyle=bodyColor;

  // body
  ctx.beginPath();
  ctx.arc(px,py-2,r,Math.PI,0);
  // wavy bottom
  const wb=py+r-4;
  ctx.lineTo(px+r,wb);
  const segs=3, sw=(r*2)/segs;
  for(let i=segs;i>=0;i--){
    const bx=px-r+i*sw;
    const by=i%2===0?wb:wb+4;
    ctx.lineTo(bx,by);
  }
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur=0;

  if(!frightened){
    // eyes
    [-4,4].forEach(ox=>{
      ctx.fillStyle=eyeColor;
      ctx.beginPath();
      ctx.ellipse(px+ox,py-3,3,4,0,0,Math.PI*2);
      ctx.fill();
      // pupils
      const [dd]=DIRS[g.dir];
      ctx.fillStyle=pupilColor;
      ctx.beginPath();
      ctx.arc(px+ox+DIRS[g.dir][0]*2,py-3+DIRS[g.dir][1]*2,2,0,Math.PI*2);
      ctx.fill();
    });
  } else {
    // scared face
    ctx.fillStyle='#ffb852';
    ctx.font='8px sans-serif';
    ctx.textAlign='center';
    ctx.fillText(flashing?'!':'',px,py+2);
  }
}

function drawHUD(){
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,canvas.width,TOP);
  ctx.fillRect(0,canvas.height-20,canvas.width,20);

  ctx.textAlign='left';
  ctx.fillStyle='#ffffff';
  ctx.font='10px "Press Start 2P"';
  ctx.fillText('SCORE',8,16);
  ctx.fillStyle='#FFE000';
  ctx.fillText(String(score).padStart(6,'0'),8,30);

  ctx.fillStyle='#ffffff';
  ctx.fillText('LV '+level,canvas.width/2-20,22);

  // lives
  for(let i=0;i<lives;i++){
    const lx=canvas.width-20-(lives-1-i)*18, ly=TOP-8;
    ctx.fillStyle='#FFE000';
    ctx.beginPath();
    ctx.moveTo(lx,ly);
    ctx.arc(lx,ly,7,0.3,Math.PI*2-0.3);
    ctx.closePath();
    ctx.fill();
  }

  // power timer bar
  if(powerTimer>0){
    ctx.fillStyle='#2121de';
    ctx.fillRect(0,TOP-3,canvas.width*(powerTimer/400),3);
  }
}

function drawTitle(){
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.textAlign='center';
  // ghost decorations
  [{x:60,c:'#FF0000'},{x:200,c:'#FFB8FF'},{x:canvas.width-200,c:'#00FFFF'},{x:canvas.width-60,c:'#FFB852'}]
    .forEach(({x,c})=>{
      ctx.fillStyle=c; ctx.shadowColor=c; ctx.shadowBlur=12;
      ctx.beginPath();
      ctx.arc(x,90,16,Math.PI,0);
      ctx.lineTo(x+16,110);
      [3,2,1].forEach((j,k)=>ctx.lineTo(x+16-k*11,j%2===0?110:103));
      ctx.closePath(); ctx.fill(); ctx.shadowBlur=0;
    });

  ctx.font='36px "Press Start 2P"';
  ctx.fillStyle='#FFE000'; ctx.shadowColor='#FFE000'; ctx.shadowBlur=20;
  ctx.fillText('PAC-MAN',canvas.width/2,160);
  ctx.shadowBlur=0;

  ctx.font='9px "Press Start 2P"';
  ctx.fillStyle='#ffb8ae';
  ctx.fillText("© 1980 NAMCO LTD.", canvas.width/2, 190);
  ctx.fillText("ALL RIGHTS RESERVED", canvas.width/2, 205);

  ctx.fillStyle='#00ff41';
  ctx.fillText('ARROWS / WASD = MOVE',canvas.width/2,270);
  ctx.fillText('EAT ALL DOTS TO WIN',canvas.width/2,290);
  ctx.fillText('POWER PELLETS = EAT GHOSTS',canvas.width/2,310);

  titleBlink++;
  if(Math.floor(titleBlink/20)%2===0){
    ctx.fillStyle='#FFE000'; ctx.shadowColor='#FFE000'; ctx.shadowBlur=10;
    ctx.font='12px "Press Start 2P"';
    ctx.fillText('PRESS SPACE TO START',canvas.width/2,380);
    ctx.shadowBlur=0;
  }

  ctx.fillStyle='#333'; ctx.font='8px "Press Start 2P"';
  ctx.fillText("1 PLAYER",canvas.width/2,canvas.height-8);
}

function drawGameOver(){
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.textAlign='center';
  ctx.font='24px "Press Start 2P"';
  ctx.fillStyle='#FF0000'; ctx.shadowColor='#FF0000'; ctx.shadowBlur=20;
  ctx.fillText('GAME OVER',canvas.width/2,canvas.height/2-20);
  ctx.shadowBlur=0;
  ctx.font='10px "Press Start 2P"';
  ctx.fillStyle='#FFE000';
  ctx.fillText('SCORE: '+score,canvas.width/2,canvas.height/2+20);
  titleBlink++;
  if(Math.floor(titleBlink/20)%2===0){
    ctx.fillStyle='#fff';
    ctx.fillText('PRESS SPACE',canvas.width/2,canvas.height/2+50);
  }
}

function drawLevelUp(){
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.textAlign='center';
  ctx.font='16px "Press Start 2P"';
  ctx.fillStyle='#00FFFF'; ctx.shadowColor='#00FFFF'; ctx.shadowBlur=15;
  ctx.fillText('LEVEL '+level+' CLEAR!',canvas.width/2,canvas.height/2);
  ctx.shadowBlur=0;
}

// ── MAIN LOOP ─────────────────────────────────────────────
function loop(){
  globalDot++;
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  if(state==='TITLE'){ drawTitle(); }
  else if(state==='GAMEOVER'){ drawMaze(); drawHUD(); drawGameOver(); }
  else {
    drawMaze();
    drawParticles();
    ghosts.forEach(drawGhost);
    if(pac.alive) drawPac();
    drawHUD();

    if(state==='PLAYING'){
      if(powerTimer>0) powerTimer--;
      updatePac();
      updateGhosts();
    }
    else if(state==='DEAD'){
      deadTimer--;
      // death animation
      const t=1-(deadTimer/180);
      const px=pac.x*CS+HALF, py=pac.y*CS+HALF+TOP;
      ctx.fillStyle='#FFE000';
      ctx.beginPath();
      ctx.moveTo(px,py);
      ctx.arc(px,py,HALF-1, t*Math.PI, (2-t)*Math.PI);
      ctx.closePath(); ctx.fill();
      if(deadTimer<=0){
        if(lives<=0){ state='GAMEOVER'; titleBlink=0; }
        else { resetPositions(); state='PLAYING'; }
      }
    }
    else if(state==='LEVELUP'){
      levelTimer--;
      drawLevelUp();
      if(levelTimer<=0){
        level++;
        dotsEaten=0;
        maze=RAW.map(r=>r.split('').map(Number));
        resetPositions();
        state='PLAYING';
        beep(523,0.1); beep(659,0.1); beep(784,0.15);
      }
    }
  }
  requestAnimationFrame(loop);
}

// simple particles for power-eat effect
let particles=[];
function drawParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.dx; p.y+=p.dy; p.life-=0.04;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.c;
    ctx.fillRect(p.x,p.y,p.s,p.s);
  }
  ctx.globalAlpha=1;
}

loop();
</script>
</body>
</html>
